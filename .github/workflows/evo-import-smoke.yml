name: "Evo Import Smoke"

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# Smoke-test ONLY. The job bootstraps a THROWAWAY Postgres service container,
# runs the full import pipeline against the current Game repo catalog, and
# discards everything when the job ends. Green means "the importer still works
# against today's Game catalog" -- nothing more. It does NOT update any
# standing database, and it can never produce a sync PR: import-taxonomy.js
# writes to the database only (never to the checkout), so the working tree is
# always clean after an import. The standing LAN database is updated manually;
# procedure and history log: docs/process/evo-import.md.
#
# History: until 2026-07 this file was named evo-import-sync.yml and carried
# "open a sync PR on changes" steps that were structurally dead (see above).
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: game
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d game"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/game?schema=public

    steps:
      - name: Checkout Game-Database
        uses: actions/checkout@v4

      - name: Checkout Game repo
        uses: actions/checkout@v4
        with:
          repository: MasterDD-L34D/Game
          path: _game

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: cd server && npm ci

      - name: Bootstrap database
        run: cd server && npm run dev:setup

      - name: Run evo:import
        run: cd server && npm run evo:import -- --repo ${{ github.workspace }}/_game
